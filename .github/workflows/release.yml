# 发布工作流：推送 v* 标签时自动构建签名 APK 并创建 GitHub Release。
# 密钥从仓库 Secrets 注入，构建机不落盘明文密码（keystore 临时解出后仅在本次任务内有效）。
# Secrets：KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::仓库 Secrets 未配置（KEYSTORE_BASE64）"
            exit 1
          fi
          mkdir -p "$HOME/.rentreceipt-keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/.rentreceipt-keystore/rentreceipt.jks"
          cat > keystore.properties <<SETTINGS
          storeFile=$HOME/.rentreceipt-keystore/rentreceipt.jks
          keyAlias=$KEY_ALIAS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          SETTINGS

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify signature (must not be debug)
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
          if "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -q "Android Debug"; then
            echo "::error::签名异常：APK 使用了 debug 密钥"
            exit 1
          fi

      - name: Read release notes from tag
        id: notes
        run: |
          BODY=$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}")
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.body }}
          files: app/build/outputs/apk/release/app-release.apk
